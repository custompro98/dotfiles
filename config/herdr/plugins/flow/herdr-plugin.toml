id = "custompro98.flow"
name = "Flow"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Conductor-style workspaces: worktree per task, opencode + terminal layout, conductor.json scripts."
platforms = ["macos", "linux"]

# Fires for every worktree herdr creates (keybinding, sidebar, or CLI), so all
# of them get the same agent + terminal layout and run the setup script.
[[events]]
on = "worktree.created"
command = ["bin/on-worktree-created"]

[[actions]]
id = "run"
title = "Run conductor.json run script"
contexts = ["workspace"]
command = ["bin/run"]
