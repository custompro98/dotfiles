id = "custompro98.flow"
name = "Flow"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Conductor-style workspaces: worktree per task, opencode + terminal layout, .conductor/settings.toml scripts, archive on close and restore (prefix+shift+o)."
platforms = ["macos", "linux"]

# Fires for every worktree herdr creates (keybinding, sidebar, or CLI), so all
# of them get the same agent + terminal layout and run the setup script.
[[events]]
on = "worktree.created"
command = ["bin/on-worktree-created"]

# Closing a worktree workspace (e.g. prefix+shift+d) archives it like
# Conductor: HEAD and uncommitted work go to refs/flow/archive/, the checkout is
# deleted, and bin/unarchive (prefix+shift+o) brings it back.
[[events]]
on = "workspace.closed"
command = ["bin/on-workspace-closed"]
