id = "custompro98.flow"
name = "Flow"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Conductor-style workspaces: disposable worktree per task, opencode + terminal layout, .conductor/settings.toml scripts, close refuses pending changes, reopen re-creates (prefix+shift+o)."
platforms = ["macos", "linux"]

# Fires for every worktree herdr creates (keybinding, sidebar, or CLI), so all
# of them get the same agent + terminal layout and run the setup script.
[[events]]
on = "worktree.created"
command = ["bin/on-worktree-created"]

# Closing a worktree workspace runs the archive script and deletes the
# checkout; the branch stays and bin/reopen (prefix+shift+o) re-creates it.
# bin/close (prefix+shift+d) refuses while there are pending changes; when a
# workspace is closed some other way, a checkout with pending changes is kept.
[[events]]
on = "workspace.closed"
command = ["bin/on-workspace-closed"]
